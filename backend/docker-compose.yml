name: local-meeting-minutes

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://meetings:${POSTGRES_PASSWORD:-meetings}@db:5432/meetings
  STORAGE_DIR: /app/storage
  WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
  WHISPER_MODEL_DIR: /models/whisper
  DIARIZATION_MODEL_DIR: /models/diarization
  AI_DEVICE: ${AI_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
  MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-14400}
  FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-1800}
  LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-6000}
  LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-32768}
  API_KEY: ${API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYANNOTE_METRICS_ENABLED: "0"

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetings}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bootstrap:
    build: {context: ., target: bootstrap}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_REPO: ${WHISPER_REPO:-Systran/faster-whisper-large-v3}
      WHISPER_REVISION: ${WHISPER_REVISION:-main}
      DIARIZATION_REVISION: ${DIARIZATION_REVISION:-main}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes: ["./models:/models"]
    networks: [setup]
    restart: "no"

  ollama-init:
    image: ollama/ollama:0.13.5
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 127.0.0.1:11434
    volumes: ["ollama_models:/root/.ollama"]
    networks: [setup]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama serve &
        server=$$!
        trap 'kill $$server; wait $$server || true' EXIT
        tries=0
        until ollama list >/dev/null 2>&1; do
          tries=$$((tries+1)); [ "$$tries" -lt 60 ] || exit 1
          sleep 1
        done
        ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"
    restart: "no"

  ollama:
    image: ollama/ollama:0.13.5
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
    volumes: ["ollama_models:/root/.ollama"]
    networks: [runtime]
    depends_on:
      ollama-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: {context: ., target: api}
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    networks: [runtime]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ., target: api}
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: ["meeting_storage:/app/storage", "./models:/models:ro"]
    networks: [runtime]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready',headers={'X-API-Key':os.getenv('API_KEY','')}); urllib.request.urlopen(r,timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: {context: ., target: worker}
    environment: *app-env
    volumes: ["meeting_storage:/app/storage", "./models:/models:ro"]
    networks: [runtime]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  runtime:
    internal: true
  setup: {}

volumes:
  postgres_data: {}
  meeting_storage: {}
  ollama_models: {}
